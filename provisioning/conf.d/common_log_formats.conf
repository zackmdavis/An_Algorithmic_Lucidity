# Access-log formats shared by every site on this box. Nothing here is
# blog-specific (contrast the aal_-namespaced maps in this directory): these
# extend nginx's built-in `combined` with two fields that stock combined leaves
# out and that can't be recovered after the fact.
#
# $sent_http_content_type -- the response's Content-Type: what was actually
#   *served*, as opposed to what was requested. Needed because the Markdown
#   content negotiation in nginx_siteconf's "location /blog/" block (see
#   markdown_negotiation_map.conf) is driven by try_files, which picks a
#   different file off disk without rewriting the request: `GET
#   /blog/2016/Jun/foo/` with `Accept: text/markdown` is byte-for-byte
#   identical in a stock combined line to the same URL fetched by a browser
#   wanting HTML. Logging what came back settles it ("text/markdown" vs
#   "text/html") without making the reader re-derive whether try_files had a
#   .md sibling to serve. (Logging the request's $http_accept instead would
#   only record what was asked for.)
#
# $host -- which site the request was for. Irrelevant while one server block
#   serves one domain, and the whole ballgame as soon as a second site moves
#   onto this VPS: it's what lets a consumer attribute a line to a site
#   whether the sites end up sharing one access log or writing separate ones.
#   Cheap to log now, impossible to backfill later, so it goes in ahead of
#   actually needing it.
#
# Both are appended *after* combined's nine fields, leaving those byte-for-byte
# identical, so a combined line is a strict prefix of one of these: anything
# that parses combined keeps working, and consumers can treat the extras as
# optional trailing groups. That last part is what lets one regex read both
# these lines and the plain-combined rotated archives already on disk (see
# LINE_RE in provisioning/ai_bot_digest.py) with no hard cutover.
#
# Note this is deliberately NOT Apache's vhost_combined convention, which is
# the one documented precedent for logging the vhost and which *prefixes* it
# ("%v:%p" ahead of combined's fields; GoAccess knows it as VCOMBINED).
# Prefixing would break every pre-existing combined line and every stock
# combined parser, to buy zero-configuration parsing in vhost-aware tools --
# a poor trade when those tools (GoAccess included) accept custom format
# strings anyway, and when per-site access logs mean the filename, not this
# field, is normally what identifies the site.
#
# $host leads the extras: it's the more likely of the two to be wanted by some
# future consumer, so it gets the stable position right after combined's end,
# where reading it doesn't require knowing about the field after it.
#
# Included once from nginx.conf's http{} block, like the map files here:
# log_format is only valid at http scope. The matching `access_log` directive
# goes in each server block (see nginx_siteconf).

log_format combined_extended '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             '"$host" "$sent_http_content_type"';
