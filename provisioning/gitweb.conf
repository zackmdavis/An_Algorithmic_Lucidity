# Absolute (not relative) paths, and under /blog/gitweb-static rather than
# gitweb's default "static/..." -- gitweb here uses query-string URLs
# (?p=repo.git;a=summary), not PATH_INFO style, so it never emits a <base
# href> to fix up relative resolution. A relative "static/gitweb.css"
# resolves against the current page's own path (e.g. /blog/source/), landing
# on /blog/source/static/gitweb.css, which nginx routes into the gitweb.cgi
# fastcgi handler (there's no location more specific than /blog/source), and
# gitweb silently ignores the bogus extra path and re-renders the project
# list as HTML -- so the "stylesheet" comes back as text/html and never
# applies. Absolute paths sidestep this regardless of gitweb's URL style.
@stylesheets = ("/blog/gitweb-static/gitweb.css");
$javascript = "/blog/gitweb-static/gitweb.js";
$logo = "/blog/gitweb-static/git-logo.png";
$favicon = "/blog/gitweb-static/git-favicon.png";

# git-diff-tree(1) options to use for generated patches
#@diff_opts = ("-M");
@diff_opts = ();

# Serve raw blobs as UTF-8. The content in this repo *is* UTF-8 (em dashes,
# curly quotes, the occasional mathematical symbol), but a=blob_plain was
# advertising "text/markdown; charset=ISO-8859-1", so anything honoring the
# header decoded it as Latin-1 and got mojibake -- which matters here because
# AI crawlers fetch these .md blobs directly (they're the cleanest available
# form of the posts: no theme chrome), and mojibake is what they'd ingest.
#
# Two more obvious fixes don't work, hence the hack below:
#
#   * gitweb's own $default_text_plain_charset (set at the bottom of this file)
#     is gated in blob_contenttype() on `$type eq 'text/plain'` -- an exact
#     string match. A .md blob resolves via /etc/mime.types to text/markdown,
#     so that branch is simply unreachable for the files we care about.
#   * $CGI::DEFAULT_CHARSET = 'utf-8' doesn't help either: CGI.pm copies that
#     package default into a per-object field when the CGI object is
#     *constructed*, and gitweb builds its $cgi before it evaluates this
#     config, so by the time we could set it the object has already captured
#     ISO-8859-1.
#
# What's actually appending "; charset=ISO-8859-1" is CGI.pm, not gitweb: its
# header() tacks its default charset onto any text/* Content-Type that doesn't
# already carry one. So rather than fight it, satisfy the condition that makes
# it stand down -- hand it a type that already says charset. We do that by
# wrapping gitweb's blob_contenttype() so its return value picks up the charset
# on the way out.
#
# Reading the Perl, since this is dense even by Perl standards:
#
#   { ... }               A bare block, purely for scope. It keeps the `no
#                         warnings` pragma from leaking into the rest of this
#                         file and keeps `$orig` out of gitweb's namespace. The
#                         anonymous sub closes over $orig, so $orig stays alive
#                         after the block ends even though its name doesn't.
#   no warnings 'redefine'
#                         Assigning over an existing sub otherwise logs
#                         "Subroutine ... redefined" to the server error log on
#                         every single request. Cosmetic; nothing else.
#   \&blob_contenttype    Takes a *reference* to the sub (a function pointer)
#                         instead of calling it -- note `\&`, not `&`. This
#                         saves gitweb's original implementation, and does so
#                         before the next line overwrites the name.
#   *blob_contenttype =   `*name` is a typeglob: the symbol-table entry for
#                         that name in the current package (gitweb runs in
#                         main::, and `do`ing this config evaluates it in main::
#                         too). Assigning a code ref to it replaces the sub that
#                         the name resolves to, so every later call anywhere in
#                         gitweb lands in ours instead. Standard Perl
#                         monkey-patch idiom.
#   $orig->(@_)           Call the saved original through the reference, passing
#                         our own arguments (@_) through untouched. gitweb's
#                         mimetype logic still does all the real work; we only
#                         decorate what it returns.
#   $type .= "..." if ... `.=` appends to a string; the trailing `if` is a
#                         statement modifier, the same as wrapping the line in
#                         an if block.
#   m!^text/!             Matches "starts with text/". The m!...! form just
#                         picks `!` as the delimiter so the `/` inside doesn't
#                         need escaping; m/^text\// would be the same thing.
#                         This guard keeps us from stamping a charset onto
#                         image/png and friends, where it'd be meaningless.
#   !~ /charset=/i        `!~` is "does not match", `/i` case-insensitive. Skips
#                         the append when a charset is already present, so a
#                         .txt blob that already got one from
#                         $default_text_plain_charset can't end up with two.
#
# Fragility to know about: this patches a gitweb internal by name. If a future
# gitweb renames or drops blob_contenttype, `\&blob_contenttype` is a reference
# to nothing and calling it dies -- a 500 on every raw-blob request, sourced
# from a config file nobody would think to suspect. Worth wrapping in
# `if (defined &blob_contenttype) { ... }` if that trade ever stops being worth
# it; today the loud failure is arguably the better one, since silent reversion
# to mojibake is the thing we're trying to prevent.
{
    no warnings 'redefine';
    my $orig = \&blob_contenttype;
    *blob_contenttype = sub {
        my $type = $orig->(@_);
        $type .= "; charset=utf-8"
            if $type =~ m!^text/! && $type !~ /charset=/i;
        return $type;
    };
}

# Kept for non-.md text blobs, which do resolve to text/plain and so do take
# gitweb's own knob.
$default_text_plain_charset = 'utf-8';
